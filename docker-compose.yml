services:
  
  clickhouse:
    image: clickhouse/clickhouse-server:26.5
    container_name: clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    ports:
      - "8123:8123"
      - "9000:9000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
       - CLICKHOUSE_USER=logstore
       - CLICKHOUSE_PASSWORD=logstore
    restart: unless-stopped
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./deploy/clickhouse:/docker-entrypoint-initdb.d

volumes:
  clickhouse_data: